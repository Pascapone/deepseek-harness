# The summary output cap inherits the 2,400-token headroom. A 1,000-token
# request output reservation lowers the proactive trigger to 4,982 tokens.
# The first checkpoint remains above this threshold; selecting it alone must
# not consume a second replayed summary or write another compaction bracket.

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  config:
    thresholdRatio: 0.8
    headroomTokens: 2400
    retainTokens: 20

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
                contextWindow: 8382
                defaultMaxTokens: 1000
